
services:
  nginx:
    container_name: ${SERVICE_NAME}_nginx
    restart: unless-stopped
    build:
      context: ./.docker/context
      dockerfile: images/nginx/Dockerfile
      args:
        PHP_FPM_SERVICE_NAME: php-fpm
    ports:
      - ${NGINX_PORT}:80
    volumes:
      - ./:/var/www:delegated
      - ./logs/nginx:/var/log/nginx:delegated
    depends_on:
      - php-fpm
    networks:
      - app-network

  php-fpm:
    container_name: ${SERVICE_NAME}_php-fpm
    restart: unless-stopped
    build:
      context: ./.docker/context
      dockerfile: images/php-fpm/dev/Dockerfile
    environment:
      APP_ENV: ${APP_ENV}
      PHP_IDE_CONFIG: serverName=php-fpm
    ports:
      - "9002:9000"
    volumes:
      - ./:/var/www:delegated
    working_dir: /var/www/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - database
      - minio
    networks:
      - app-network

  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: ${SERVICE_NAME}_postgres
    ports:
      - ${POSTGRES_DB_PORT}:5432
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
      POSTGRES_USER: ${POSTGRES_DB_USER}
    volumes:
      - ./.docker/data/postgres_data:/var/lib/postgresql/data:rw
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    container_name: ${SERVICE_NAME}_minio
    restart: unless-stopped
    command: server --console-address ":9001" /data/
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./.docker/data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - app-network

  create-buckets:
    image: minio/mc
    container_name: ${SERVICE_NAME}_minio-create-buckets
    depends_on:
      - minio
    volumes:
        - './.docker/context/conf/minio:/etc/minio'
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_BUCKET: ${AWS_BUCKET}
      AWS_ENDPOINT: ${AWS_ENDPOINT}
    entrypoint: >
      /bin/sh -c "
      mc config host add myminio http://minio:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY};
      mc mb myminio/${AWS_BUCKET};
      mc policy set public myminio/${AWS_BUCKET};
      mc policy download myminio/${AWS_BUCKET};
      exit 0;
      "
    networks:
      - app-network

volumes:
  minio-storage:

networks:
  app-network:
    name: app-network
