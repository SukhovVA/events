parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\EventListener\ExceptionListener:
      tags:
        - { name: kernel.event_listener, event: kernel.exception }

    App\Security\AccessTokenHandler:
      arguments:
        $accessSecret: '%env(ACCESS_SECRET)%'

    App\Service\MailService:
      arguments:
        $fromEmail: '%env(FROM_EMAIL)%'

    App\Gateway\ProsvGateway:
      arguments:
        $baseUrl: '%env(ID_PROSV_URL)%'
        $clientId: '%env(ID_PROSV_CLIENT_ID)%'
        $clientSalt: '%env(ID_PROSV_CLIENT_SECRET)%'
