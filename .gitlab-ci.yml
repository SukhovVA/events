# Используем образ с PHP и Composer
image: php:8.1-cli

# Определяем этапы (stages)
stages:
  - build
  - test
  - deploy

# Кэшируем зависимости Composer для ускорения сборки
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - vendor/

# Переменные окружения
variables:
  POSTGRES_DB: test_db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST_AUTH_METHOD: trust
  DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"

# Этап сборки
build:
  stage: build
  script:
    - apt-get update && apt-get install -y unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --prefer-dist --no-progress --no-suggest
  artifacts:
    paths:
      - vendor/

# Этап тестирования
test:
  stage: test
  services:
    - postgres:13
  script:
    - php -v
    - echo "Подготовка базы данных PostgreSQL..."
    - apt-get update && apt-get install -y postgresql-client
    - psql --version
    - psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
    - echo "Выполнение миграций Doctrine..."
    - php bin/console doctrine:migrations:migrate --no-interaction
    - echo "Запуск тестов..."
    - php bin/phpunit --coverage-text --colors=never
  allow_failure: false

# Этап деплоя (пример для деплоя на сервер через SSH)
deploy:
  stage: deploy
  script:
    - echo "Деплой на сервер..."
    - apt-get update && apt-get install -y openssh-client rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan $DEPLOY_SERVER >> ~/.ssh/known_hosts
    - rsync -avz --delete ./ deployer@$DEPLOY_SERVER:/var/www/app
  only:
    - main
